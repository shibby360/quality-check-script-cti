<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mic Test</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 600px; margin: 24px auto; padding: 0 16px; }
  select, canvas, audio, meter { width: 100%; }
  button { padding: 8px 16px; margin: 0 4px 8px 0; }
  meter { height: 20px; }
  canvas { display: block; height: 80px; margin: 12px 0; background: #f2f2f2; }
</style>
</head>
<body>
<h1>Mic Test</h1>

<p><label>Microphone <select id="mic"><option value="">Default microphone</option></select></label></p>

<button id="test">Start test</button>
<button id="record" disabled>Start recording</button>

<p id="status" role="status">Not connected</p>

<div>Input volume: <span id="percent">0%</span></div>
<meter id="level" min="0" max="100" value="0"></meter>
<canvas id="spectrum"></canvas>

<div id="result" hidden>
  <audio id="playback" controls></audio>
  <p><a id="download">Download recording</a></p>
</div>

<script>
const $ = (id) => document.getElementById(id);
const canvas = $("spectrum");
const ctx = canvas.getContext("2d");

let stream = null;     // live mic input; non-null while testing
let audioCtx = null;
let frame = 0;         // animation frame id
let recorder = null;   // non-null while recording
let timer = 0;

// Device names are only revealed after mic permission is granted.
async function listMics() {
  const mics = (await navigator.mediaDevices.enumerateDevices())
    .filter((d) => d.kind === "audioinput" && d.deviceId);
  if (!mics.length) return;
  const current = stream
    ? stream.getAudioTracks()[0].getSettings().deviceId
    : $("mic").value;
  $("mic").replaceChildren(...mics.map((d, i) =>
    new Option(d.label || `Microphone ${i + 1}`, d.deviceId)));
  if (mics.some((d) => d.deviceId === current)) $("mic").value = current;
}

async function startTest() {
  $("test").disabled = $("mic").disabled = true;
  $("status").textContent = "Connecting...";
  try {
    const id = $("mic").value;
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { deviceId: id ? { exact: id } : undefined, echoCancellation: false }
    });
    audioCtx = new AudioContext();
    await audioCtx.resume();
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    // Mic -> analyser only. Nothing goes to the speakers.
    audioCtx.createMediaStreamSource(stream).connect(analyser);

    // Fires if the mic is unplugged or access is cut off.
    stream.getAudioTracks()[0].onended = () => {
      stopTest();
      $("status").textContent = "Microphone disconnected";
    };

    await listMics();
    $("status").textContent = "Testing";
    $("test").textContent = "Stop test";
    $("record").disabled = !window.MediaRecorder;
    draw(analyser);
  } catch (err) {
    stopTest();
    $("status").textContent = "Error: " + (err.message || err.name);
  }
  $("test").disabled = $("mic").disabled = false;
}

function stopTest() {
  stopRecording();
  cancelAnimationFrame(frame);
  if (stream) stream.getTracks().forEach((t) => t.stop());
  if (audioCtx) audioCtx.close();
  stream = audioCtx = null;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  $("level").value = 0;
  $("percent").textContent = "0%";
  $("status").textContent = "Stopped";
  $("test").textContent = "Start test";
  $("record").disabled = true;
}

function draw(analyser) {
  const data = new Uint8Array(analyser.frequencyBinCount);
  const history = new Array(60).fill(0);

  (function loop() {
    analyser.getByteFrequencyData(data);

    // Volume = strongest frequency bin, averaged over the last 60 frames.
    history.shift();
    history.push(Math.max(...data) / 255);
    const volume = Math.round(history.reduce((a, b) => a + b) / history.length * 100);
    $("level").value = volume;
    $("percent").textContent = volume + "%";

    // Match the drawing buffer to the on-screen size (this also clears it).
    canvas.width = canvas.clientWidth * devicePixelRatio;
    canvas.height = canvas.clientHeight * devicePixelRatio;
    const barWidth = canvas.width / data.length * 2.5;
    ctx.fillStyle = "#555";
    data.forEach((v, i) => {
      const h = v / 255 * canvas.height;
      ctx.fillRect(i * (barWidth + devicePixelRatio), canvas.height - h, barWidth, h);
    });

    frame = requestAnimationFrame(loop);
  })();
}

function startRecording() {
  const chunks = [];
  try {
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    const rec = recorder;
    rec.onstop = () => saveRecording(new Blob(chunks, { type: rec.mimeType || chunks[0]?.type }));
    recorder.start(100);
  } catch (err) {
    recorder = null;
    $("status").textContent = "Could not record: " + err.message;
    return;
  }

  $("playback").pause();
  const started = Date.now();
  const tick = () => {
    const s = Math.floor((Date.now() - started) / 1000);
    $("status").textContent = "Testing + recording " +
      String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  };
  tick();
  timer = setInterval(tick, 500);
  $("record").textContent = "Stop recording";
}

function stopRecording() {
  clearInterval(timer);
  if (recorder && recorder.state !== "inactive") recorder.stop();
  recorder = null;
  $("record").textContent = "Start recording";
  if (stream) $("status").textContent = "Testing";
}

function saveRecording(blob) {
  if (!blob.size) return;
  if ($("playback").src) URL.revokeObjectURL($("playback").src);
  const url = URL.createObjectURL(blob);
  // The format depends on the browser, so pick the extension to match.
  const ext = blob.type.includes("mp4") ? "m4a" : blob.type.includes("ogg") ? "ogg" : "webm";
  $("playback").src = url;
  $("download").href = url;
  $("download").download = `recording-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-")}.${ext}`;
  $("result").hidden = false;
}

$("test").onclick = () => stream ? stopTest() : startTest();
$("record").onclick = () => recorder ? stopRecording() : startRecording();
// Switching mics during a test restarts it (and finishes any recording).
$("mic").onchange = () => { if (stream) { stopTest(); startTest(); } };

if (navigator.mediaDevices) {
  listMics().catch(() => {});
  navigator.mediaDevices.addEventListener("devicechange", () => listMics().catch(() => {}));
} else {
  $("status").textContent = "This browser can't access the microphone here. Try opening the page over HTTPS or localhost.";
  $("test").disabled = true;
}
</script>
</body>
</html>
